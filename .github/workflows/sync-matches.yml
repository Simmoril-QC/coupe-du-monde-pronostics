#!/bin/bash

# GitHub Actions workflow for syncing match data from FIFA API
# Runs every 15 minutes to update the database with latest scores

name: Sync Match Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Sync match data from FIFA API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/sync-matches.js
          
      - name: Update last sync timestamp
        run: |
          echo "Last sync: $(date -u)" >> scripts/last_sync.txt
